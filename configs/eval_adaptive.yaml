defaults:
  - dataset: clevr_base
  - verifier: open_router
  - _self_

hydra:
  job:
    chdir: false

ckpt: ???
use_ema: true
out_dir: results/eval_adaptive

model:
  _target_: models.qwen_dit.QwenDiT
  name: DiT-L/4
  image_size: 256
  vae: stabilityai/sdxl-vae
  context_dropout_prob: 0.0

context_encoder:
  _target_: algorithms.on_policy.QwenContextEncoder
  model_id: Qwen/Qwen3.5-4B
  device: cuda
  vlm_dtype: bfloat16
  device_map: null
  max_length: 4096
  include_metadata: false

split: val
num_captions: 8
steps: 4
caption_seed: 0
seed: 0

sampling:
  num_sampling_steps: 50
  cfg_scale: 1.0
  ddim_eta: 0.0

scorer:
  workers: 16
  max_tokens: 16

wandb:
  project: DiT-qwen-clevr
  name: null
