defaults:
  - dataset: clevr_base
  - verifier: open_router
  - _self_

hydra:
  job:
    chdir: false

ckpt: ???
use_ema: true
out_dir: results/eval_adaptive

model:
  _target_: models.qwen_dit.QwenDiT
  name: DiT-L/4
  image_size: 256
  vae: stabilityai/sdxl-vae
  context_dropout_prob: 0.0
  context_encoder:
    freeze_encoder: true
    model_id: Qwen/Qwen3.5-4B
    dtype: bfloat16
    max_length: 4096
    lora_rank: 16
    lora_alpha: 16
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

split: val
num_captions: 8
steps: 4
caption_seed: 0
seed: 0

sampling:
  num_sampling_steps: 50
  cfg_scale: 1.0
  ddim_eta: 0.0

wandb:
  project: DiT-qwen-clevr
  name: null
