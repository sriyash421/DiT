hydra:
  job:
    chdir: false

data:
  split: train
  use_disk: true
  load_meta: true
  load_images: false
  load_context: false
  dataset_config:
    - name: base
      dataset_path: /gscratch/scrubbed/sriyash/clevr_dit_dataset_filtered/data.zarr
      sampling_ratio: 0.25
    - name: feedback
      dataset_path: /gscratch/scrubbed/sriyash/vlm_feedback_dataset_l4_40k/data.zarr
      sampling_ratio: 0.75

model:
  name: DiT-L/4
  image_size: 256
  num_classes: 1000
  vae: stabilityai/sdxl-vae
  context_dropout_prob: 0.1

train:
  results_dir: /gpfs/scrubbed/sriyash/DiT-step1
  experiment_name: feedback_l4
  ckpt: results/base_l4_lr1e-4_minlr1e-5_warmup5k_ema999_final2/checkpoints/0040000-ema.pt
  epochs: 1000
  global_batch_size: 128
  global_seed: 0
  lr: 1e-5
  lr_schedule: cosine
  lr_warmup_steps: 3000
  min_lr: 1e-6
  min_lr_ratio: 0.1
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 100
  ckpt_every: 5000
  max_train_steps: 100000

dataloader:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  drop_last: true

eval:
  split: val
  batch_size: 32
  max_batches_per_dataset: 32
  dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: false
    prefetch_factor: 2

wandb:
  project: DiT-qwen-clevr
