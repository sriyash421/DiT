defaults:
  - dataset: clevr_base
  - _self_

hydra:
  job:
    chdir: false

ckpt: null
results_dir: /gscratch/scrubbed/sriyash/DiT-qwen-clevr-base
experiment_name: base_l4

model:
  _target_: models.qwen_dit.QwenDiT
  name: DiT-L/4
  image_size: 256
  vae: stabilityai/sdxl-vae
  context_dropout_prob: 0.0
  context_encoder:
    freeze_encoder: false
    model_id: Qwen/Qwen3.5-4B
    dtype: bfloat16
    max_length: 4096
    lora_rank: 16
    lora_alpha: 16
    lora_target_modules: [q_proj, k_proj, v_proj, o_proj]

trainer:
  _target_: algorithms.offline.OfflineTrainer
  epochs: 10000
  max_train_steps: 100000
  global_batch_size: 64
  global_seed: 0
  lr: 1e-4
  lr_schedule: cosine
  lr_warmup_steps: 3000
  min_lr: 1e-5
  weight_decay: 0.0
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 100
  ckpt_every: 10000
  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    drop_last: true
  eval:
    split: val
    batch_size: 64
    max_batches_per_dataset: 16
    dataloader:
      num_workers: 2
      pin_memory: true
      persistent_workers: false
      prefetch_factor: 2

wandb:
  project: DiT-qwen-clevr
