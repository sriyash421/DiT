defaults:
  - dataset: clevr_base
  - _self_

hydra:
  job:
    chdir: false

ckpt: null
results_dir: /gscratch/scrubbed/sriyash/OmniGen-clevr
experiment_name: omni_lora_finetune

dataset:
  image_size: 256

model:
  _target_: models.omni_gen.OmniGenModel
  model_name_or_path: Shitao/OmniGen-v1
  image_height: 256
  image_width: 256
  vae: null
  lora_finetune: false
  lora_rank: 128
  lora_alpha: 128
  lora_init: gaussian
  lora_target_modules:
    - qkv_proj
    - o_proj
    - gate_up_proj
    - down_proj
  gradient_checkpointing: false
  mixed_precision: bf16
  condition_dropout_prob: 0.01
  max_input_length_limit: 18000
  use_feedback_images: false
  keep_raw_resolution: false

trainer:
  _target_: algorithms.offline.OfflineTrainer
  epochs: 1000
  max_train_steps: 100000
  global_batch_size: 32
  global_seed: 0
  lr: 5e-5
  lr_schedule: cosine
  lr_warmup_steps: 5000
  min_lr: 1e-6
  weight_decay: 0.01
  grad_clip: 1.0
  ema_decay: 0.0
  log_every: 100
  ckpt_every: 5000
  dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true
  eval:
    split: val
    batch_size: 32
    max_batches_per_dataset: 8
    dataloader:
      num_workers: 2
      pin_memory: true
      persistent_workers: false
      prefetch_factor: 2

wandb:
  project: DiT-qwen-clevr
