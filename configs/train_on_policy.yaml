defaults:
  - dataset: clevr_on_policy
  - verifier: gemini
  - _self_

hydra:
  job:
    chdir: false

ckpt: /gscratch/scrubbed/sriyash/DiT-qwen-clevr-base/base_l4/checkpoints/0100000-ema.pt
results_dir: /gscratch/scrubbed/sriyash/DiT-qwen-clevr-on-policy
experiment_name: on_policy_l4

model:
  _target_: models.qwen_dit.QwenDiT
  name: DiT-L/4
  image_size: 256
  vae: stabilityai/sdxl-vae
  context_dropout_prob: 0.1

trainer:
  _target_: algorithms.on_policy.OnPolicyTrainer
  verifier: ${verifier}
  context_encoder:
    _target_: algorithms.on_policy.QwenContextEncoder
    model_id: Qwen/Qwen3.5-4B
    device: cuda
    vlm_dtype: bfloat16
    device_map: null
    max_length: 4096
    include_metadata: false
  val_dataset:
    _target_: datasets.build_clevr_dataset
    datasets: ${dataset.datasets}
    split: val
    image_size: ${model.image_size}
    use_disk: true
    load_meta: true
    load_images: false
    load_context: false
  sampler:
    type: ddim
    num_sampling_steps: 50
    cfg_scale: 1.0
    ddim_eta: 0.0
  rollout:
    samples: 128
    length: 1
    use_ema: true
    storage_dir: null
    log_samples: 8
    batch_size: 32
  lr: 1e-5
  weight_decay: 0.0
  global_batch_size: 16
  global_seed: 0
  updates_per_rollout: 1000
  max_train_steps: 10000
  grad_clip: 1.0
  ema_decay: 0.99
  log_every: 50
  ckpt_every: 500
  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    drop_last: true
  eval:
    caption_index: 20
    batch_size: 8
    seed: 0
    steps: 1

wandb:
  project: DiT-qwen-clevr
