hydra:
  job:
    chdir: false

data:
  dataset_path: /gpfs/scrubbed/sriyash/clevr_dit_dataset/data.zarr
  split: train
  max_dataset_size: 50
  use_disk: true
  load_images: true
  load_context: true

model:
  name: DiT-L/4
  image_size: 256
  num_classes: 1000
  vae: stabilityai/sdxl-vae
  context_dropout_prob: 0.1

sampler:
  type: ddim
  num_sampling_steps: 50
  cfg_scale: 1.0
  ddim_eta: 0.0

verifier:
  name: gemini
  api_key_env: GEMINI_API_KEY
  api_url: https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent
  model: gemini-3.1-flash-lite
  temperature: 0.0
  max_tokens: 128
  retries: 2
  timeout: 120
  workers: 32

context_encoder:
  name: qwen
  model: Qwen/Qwen3.5-4B
  dtype: bfloat16
  device_map: null
  max_length: 1024

loss:
  feedback_weight: 1.0
  base_weight: 1.0

train:
  results_dir: /gpfs/scrubbed/sriyash/DiT-qwen-clevr-on-policy-debug
  experiment_name: on_policy_s4
  ckpt: /gpfs/scrubbed/sriyash/DiT-qwen-clevr-base/base_l4_lr1e-4_minlr1e-5_warmup5k_ema999/checkpoints/0200000-ema.pt
  pretraining_steps: 0
  pretraining_data_ratio: 1.0
  global_batch_size: 16
  global_seed: 0
  pretrain_optimizer:
    lr: 1e-4
    lr_schedule: cosine
    lr_warmup_steps: 500
    min_lr: 1e-6
    min_lr_ratio: 0.1
    weight_decay: 0.0
  finetune_optimizer:
    lr: 1e-5
    lr_schedule: cosine
    lr_warmup_steps: 500
    min_lr: 1e-6
    min_lr_ratio: 0.1
    weight_decay: 0.0
  grad_clip: 1.0
  ema_decay: 0.99
  log_every: 50
  ckpt_every: 500
  max_train_steps: 10000
  updates_per_rollout: 1000

rollout:
  samples: 128
  use_ema: true
  storage_dir: null
  log_samples: 8

dataloader:
  num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  drop_last: true

eval:
  enabled: true
  split: val
  caption_index: 20
  batch_size: 8
  seed: 0

wandb:
  project: DiT-qwen-clevr
