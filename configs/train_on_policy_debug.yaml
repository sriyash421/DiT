defaults:
  - train_on_policy
  - _self_

ckpt: null
experiment_name: on_policy_debug_s4

dataset:
  datasets:
    - name: base
      path: /gscratch/scrubbed/sriyash/clevr_dit_dataset_debug/data.zarr
      sampling_ratio: 1.0
      max_dataset_size: 500

model:
  name: DiT-S/4

pretrain:
  _target_: algorithms.offline.OfflineTrainer
  epochs: 10000
  max_train_steps: 10000
  global_batch_size: 32
  global_seed: 0
  lr: 1e-4
  lr_schedule: none
  lr_warmup_steps: 0
  min_lr: 0.0
  weight_decay: 0.0
  grad_clip: 1.0
  ema_decay: 0.99
  log_every: 50
  ckpt_every: 10000
  dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true
  eval:
    split: val
    batch_size: 32
    max_batches_per_dataset: 8
    dataloader:
      num_workers: 2
      pin_memory: true
      persistent_workers: false
      prefetch_factor: 2

trainer:
  val_dataset:
    split: train
  global_batch_size: 32
  updates_per_rollout: 5000
  max_train_steps: 50000
  rollout:
    samples: 1024
    batch_size: 32
  dataloader:
    num_workers: 4
    prefetch_factor: 2
  eval:
    caption_index: 0
    batch_size: 32
