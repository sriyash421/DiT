# On-policy feedback training on clevr_g6, starting from the 100-image model's step-250 checkpoint.
#
# The loss is NOT RL: rollout_loss is ordinary flow matching regressing to the ground-truth image,
# conditioned on [caption, attempt_1, feedback_1, ...]. The verifier never enters the objective; it
# only writes the language context. So this is conditional behaviour cloning on self-generated
# errors, and the claim it can support is about SEQUENTIAL pass@k (accuracy after k feedback-guided
# repairs), not about iid best-of-N.
#
# DATA BUDGET: exactly the same 100 images the base model was trained on (clevr_g6_tiny, split
# train). Zero new supervision -- that is what makes a gain attributable to the feedback loop.
# The 2,000 held-out captions are used for measurement only.
defaults:
  - dataset: clevr_g6_tiny
  - verifier: clevr_detector_g6
  - _self_

hydra:
  job:
    chdir: false

# `ckpt` stays null: the base model is a FULL-FT .pt with no lora_ keys, so loading it through `ckpt`
# under lora_finetune=true would match nothing and silently leave raw OmniGen-v1 underneath. It goes
# in via model.base_ckpt, which strict-loads it as the frozen LoRA base.
ckpt: null
start_step: 0
# G6_RESULTS: checkpoints and logs land here; needs ~50GB. Keep it off a quota-tight filesystem
# -- this project has already lost a run to a disk quota error mid-eval.
results_dir: ${oc.env:G6_RESULTS,/gscratch/scrubbed/sriyash/omni-clevr-g6-on-policy}
experiment_name: on_policy_g6_reject

dataset:
  image_size: 256

model:
  _target_: models.omni_gen.OmniGenModel
  model_name_or_path: Shitao/OmniGen-v1
  # G6_BASE_CKPT: the frozen base the LoRA trains on top of, 22.8GB, from the HF model repo.
  # It goes in HERE, not through `ckpt` -- it is a full-FT .pt with no lora_ keys, so loading it
  # as `ckpt` under lora_finetune=true would match nothing and silently leave raw OmniGen-v1.
  base_ckpt: ${oc.env:G6_BASE_CKPT,/gscratch/socialrl/sriyash/OmniGen-clevr-g6-tiny2k/clevr_g6_tiny2k/checkpoints/0000250.pt}
  image_height: 256
  image_width: 256
  vae: null
  lora_finetune: true           # fresh adapter on a frozen D@250 base; also keeps checkpoints ~1GB
  lora_rank: 128
  lora_alpha: 128
  lora_init: gaussian
  lora_target_modules: [qkv_proj, o_proj, gate_up_proj, down_proj]
  gradient_checkpointing: true   # rollout_loss OOM'd on a 48GB L40S: a record carries up to 3
                                # prior attempt images (768 image tokens) + 4 caption repeats.
                                # Non-reentrant checkpointing is DDP-safe here (see omni_gen.py)
                                # and keeps batch/LR/epochs unchanged; generation dominates
                                # wall-clock (230s rollout vs ~50 update steps), so the cost is small.
  mixed_precision: bf16
  condition_dropout_prob: 0.0
  max_input_length_limit: 18000
  use_feedback_images: true     # no-op for on-policy (rollout_loss always passes prior attempts);
                                # set true so the offline path would agree if it were ever used
  keep_raw_resolution: false
  stored_noise_prob: 1.0        # train on the rollout's stored x_T, so training noise == sampling noise

trainer:
  _target_: algorithms.on_policy.OnPolicyTrainer
  verifier: ${verifier}
  resume: null                  # job script fills this with the newest checkpoint on requeue
  val_dataset:
    _target_: datasets.build_clevr_dataset
    datasets: ${dataset.datasets}
    split: test                 # the held-out 2,000 -- measured, never trained on
    image_size: ${dataset.image_size}
    use_disk: true
    load_meta: true
    load_images: false
    load_context: false
  sampler:
    type: ddim
    num_sampling_steps: 25      # matches every other eval in this project
    cfg_scale: 3.0
    ddim_eta: 0.0
  rollout:
    samples: 100                # one pass over the 100 training prompts per outer iteration
    length: 4                   # attempt + 3 feedback-conditioned repairs; D@250 averages 2.25
                                # errors/scene and 100% of its scenes are repairable in <=3 edits.
                                # Chains run the full 4 steps even after success, so the model also
                                # learns to HOLD a correct image rather than drift off it.
    use_ema: false
    storage_dir: ${oc.env:ROLLOUT_DIR,/gscratch/scrubbed/sriyash/rollouts/g6_reject}
                                # NOT /dev/shm: never pruned. Rejection writes then deletes
                                # rejected chains, so peak usage is ~1 buffer, not oversample x.
    log_samples: 8
    batch_size: 32              # GLOBAL, divided by world size. Must be divisible by it.

    # ---- THE ONE CHANGE FROM THE CONTROL --------------------------------------------------------
    # A chain is DEGENERATE when its first attempt is already exact: every later row in it is then
    # conditioned on the critique "no update", so it teaches copy-the-image, not repair.
    #
    # Measured on the control run's own 100 outer loops of saved rollout records, the share of
    # repair rows conditioned on "no update" ran 9.7% -> 87.7%. By outer 40 the buffer was ~80%
    # degenerate and stayed there, so roughly the last 3,000 of 5,000 gradient steps trained on a
    # buffer where about one row in eight carried a real edit.
    #
    # This keeps sampling until the buffer holds `samples` chains with at most this share
    # degenerate. The buffer stays FULL -- rejection costs generation, not training signal.
    max_no_update_frac: 0.25
    # Ceiling on that extra generation. The control's rates imply ~1x early and ~6x by outer 100 at
    # a 0.25 cap, so 8x leaves headroom without letting a late loop spin forever. When the budget is
    # spent the loop takes what it has and logs the realised composition rather than failing.
    max_oversample: 8.0
  lr: 5e-5                      # fixed; this trainer has no LR schedule
  weight_decay: 0.0
  global_batch_size: 32
  global_seed: 0
  updates_per_rollout: 50       # ~4 epochs over the 400 records/iter -- a diffusion model needs the
                                # update count, and staleness is tolerable because the target is GT
  max_train_steps: 5000         # 100 outer iterations x 50 updates
  grad_clip: 1.0
  ema_decay: 0.0
  log_every: 50
  ckpt_every: 250               # runs on preemptable ckpt-all: a preemption loses everything since
                                # the last save, so save every 5 outer iterations (~1GB LoRA each)
  eval_every: 500               # eval is rank-0-only and blocking -- keep it at 10 points, not 20.
                                # The REPORTED model is the final checkpoint (5000), fixed in
                                # advance, so there is no checkpoint cherry-picking
  dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    drop_last: true
  eval:
    use_clevr_detector_scorer: true
    detector_probe_path: ${oc.env:G6_PROBE,/gscratch/scrubbed/sriyash/models/clevr_shape_probe_g6.pt}
    # Forwarded so the eval scorer scores placement exactly like the rollout verifier; without these
    # eval/distance_step_* would stay position-blind.
    detector_cell_centres: [[37, 194], [110, 194], [182, 194], [74, 58], [146, 58], [219, 58]]
    detector_cell_tol: 30.0
    caption_index: 42
    batch_size: 32
    seed: 0
    steps: 4                    # logs eval/distance_step_0..3 -- the sequential curve
wandb:
  project: clevr_g6
  auto_resume: true   # preemptable partition: re-attach to the same run on requeue (see train.py)
