defaults:
  - dataset: clevr_on_policy
  - verifier: vllm_qwen
  - _self_

hydra:
  job:
    chdir: false

verifier:
  api_url: http://g3102:8000/v1
  workers: 100

ckpt: /gscratch/scrubbed/sriyash/OmniGen-clevr/omni_lora_finetune_five_objects/checkpoints/0010000.pt
ckpt_use_ema: true  # the raw "model" state of this checkpoint generates garbage; its EMA state is the validated one
results_dir: /gscratch/scrubbed/sriyash/omni-clevr-on-policy
experiment_name: on_policy_five_objects_9b_verifier_ema

dataset:
  image_size: 256

model:
  _target_: models.omni_gen.OmniGenModel
  model_name_or_path: Shitao/OmniGen-v1
  image_height: 256
  image_width: 256
  vae: null
  lora_finetune: false
  lora_rank: 128
  lora_alpha: 128
  lora_init: gaussian
  lora_target_modules:
    - qkv_proj
    - o_proj
    - gate_up_proj
    - down_proj
  gradient_checkpointing: false
  mixed_precision: bf16
  condition_dropout_prob: 0.0
  max_input_length_limit: 18000
  use_feedback_images: false
  keep_raw_resolution: false

trainer:
  _target_: algorithms.on_policy.OnPolicyTrainer
  verifier: ${verifier}
  val_dataset:
    _target_: datasets.build_clevr_dataset
    datasets: ${dataset.datasets}
    split: val
    image_size: ${dataset.image_size}
    use_disk: true
    load_meta: true
    load_images: false
    load_context: false
  sampler:
    type: ddim
    num_sampling_steps: 25
    cfg_scale: 1.0
    ddim_eta: 0.0
  rollout:
    samples: 1024
    length: 4
    use_ema: true
    storage_dir: null
    log_samples: 8
    batch_size: 128
  lr: 1e-5
  weight_decay: 0.0
  global_batch_size: 32
  global_seed: 0
  updates_per_rollout: 512
  max_train_steps: 50000
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 50
  ckpt_every: 1024  # updates_per_rollout(512) * 2 rollouts, per user request
  dataloader:
    num_workers: 8
    pin_memory: true
    persistent_workers: true
    prefetch_factor: 4
    drop_last: true
  eval:
    caption_index: 42
    batch_size: 64
    seed: 0
    steps: 4

wandb:
  project: DiT-qwen-clevr
