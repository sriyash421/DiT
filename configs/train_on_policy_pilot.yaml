defaults:
  - train_on_policy
  - override verifier: vllm_qwen
  - _self_

experiment_name: on_policy_pilot_l4

dataset:
  datasets:
    - name: base
      path: /gscratch/scrubbed/sriyash/clevr_dit_dataset/data.zarr
      sampling_ratio: 1.0
      max_dataset_size: 50

verifier:
  api_url: http://g3128:8000/v1

trainer:
  context_encoder:
    max_length: 4096
    include_metadata: false
  val_dataset:
    split: train
  rollout:
    length: 4
  updates_per_rollout: 50
  max_train_steps: 5000
  ema_decay: 0.999
  log_every: 25
  ckpt_every: 2500
  dataloader:
    num_workers: 4
    prefetch_factor: 2
    drop_last: false
  eval:
    caption_index: 0
    batch_size: 16
    steps: 4
