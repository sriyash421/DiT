hydra:
  job:
    chdir: false

data:
  dataset_path: /gscratch/scrubbed/sriyash/clevr_feedback_debug/data/base_50.zarr
  split: train
  max_dataset_size: 50
  use_disk: true
  load_images: true
  load_context: true

model:
  name: DiT-L/4
  image_size: 256
  num_classes: 1000
  vae: stabilityai/sdxl-vae
  context_dropout_prob: 0.1

sampler:
  type: ddim
  num_sampling_steps: 50
  cfg_scale: 1.0
  ddim_eta: 0.0

verifier:
  name: qwen-vllm
  api_url: http://g3128:8000/v1
  api_key: EMPTY
  model: Qwen/Qwen3.5-27B
  temperature: 0.0
  max_tokens: 64
  retries: 2
  timeout: 180
  workers: 64
  enable_thinking: false
  include_caption: true
  include_metadata: false
  image_size: 256
  api_key_env: GEMINI_API_KEY

context_encoder:
  name: qwen
  model: Qwen/Qwen3.5-4B
  dtype: bfloat16
  device_map: null
  max_length: 2048
  include_metadata: false

loss:
  feedback_weight: 1.0
  base_weight: 0.0

train:
  results_dir: /gscratch/scrubbed/sriyash/clevr_onpolicy_debug/runs
  experiment_name: pilot_l4_40k_100x128_len4_lr1e-5
  ckpt: results/base_l4_lr1e-4_minlr1e-5_warmup5k_ema999_final2/checkpoints/0040000-ema.pt
  pretraining_steps: 0
  pretraining_data_ratio: 1.0
  global_batch_size: 16
  global_seed: 0
  pretrain_optimizer:
    lr: 1e-4
    lr_schedule: constant
    lr_warmup_steps: 0
    min_lr: 1e-4
    min_lr_ratio: 1.0
    weight_decay: 0.0
  finetune_optimizer:
    lr: 1e-5
    lr_schedule: constant
    lr_warmup_steps: 0
    min_lr: 1e-5
    min_lr_ratio: 1.0
    weight_decay: 0.0
  grad_clip: 1.0
  ema_decay: 0.999
  log_every: 25
  ckpt_every: 2500
  max_train_steps: 5000
  updates_per_rollout: 50

rollout:
  samples: 128
  length: 4
  use_ema: true
  storage_dir: /gscratch/scrubbed/sriyash/clevr_onpolicy_debug/rollouts/pilot_l4_40k_100x128_len4_lr1e-5
  log_samples: 8
  batch_size: 32

dataloader:
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  drop_last: false

eval:
  enabled: true
  split: train
  caption_index: 0
  batch_size: 16
  seed: 0
  steps: 4

wandb:
  project: DiT-qwen-clevr
